server {
    listen 80;
    server_name i8studio.vn www.i8studio.vn;
    return 301 https://i8studio.vn$request_uri;
}
server {
    listen 443 ssl;
    server_name www.i8studio.vn;
    ssl_certificate /home/cert/cert.pem;
    ssl_certificate_key /home/cert/private.key;
    return 301 https://i8studio.vn$request_uri;
}
server {
    listen 443 ssl;
    server_name i8studio.vn;

    # --- SSL Hardening ---
    ssl_certificate /home/cert/cert.pem;
    ssl_certificate_key /home/cert/private.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # --- Security Headers ---
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Hide Nginx version
    server_tokens off;

    # --- Uploads (static files) ---
    location ^~ /uploads/ {
        alias /srv/i8studio-uploads/;
        add_header Cache-Control "public, max-age=86400";
        add_header X-Content-Type-Options "nosniff" always;

        # Only allow known safe file types
        location ~* \.(jpg|jpeg|png|webp|gif|svg|mp4|webm|mov|pdf|ico)$ {
            try_files $uri =404;
        }

        # Block everything else (e.g. .php, .html, .js, .sh)
        return 403;
    }

    # --- Proxy to Next.js app ---
    location / {
        proxy_pass http://i8studio_app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Proxy buffer settings for large responses
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 4 32k;
    }

    client_max_body_size 200M;
}

